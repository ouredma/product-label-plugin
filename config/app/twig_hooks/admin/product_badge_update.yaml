sylius_twig_hooks:
    hooks:
        'sylius_admin.product_badge.update.content':
            form:
                component: 'integritty:product_badge:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@IntegrittySyliusProductBadgePlugin/admin/product_badge/form.html.twig'
                configuration:
                   method: 'PUT'
                priority: 0

        'sylius_admin.product_badge.update.content.form':
            sections:
                template: '@IntegrittySyliusProductBadgePlugin/admin/product_badge/form/sections.html.twig'
                priority: 0

        'sylius_admin.product_badge.update.content.form.sections':
            general:
                template: '@IntegrittySyliusProductBadgePlugin/admin/product_badge/form/sections/general.html.twig'
                priority: 200
            translations:
                template: '@IntegrittySyliusProductBadgePlugin/admin/product_badge/form/sections/translations.html.twig'
                priority: 100
                
        'sylius_admin.product_badge.update.content.form.sections.general':
            default:
                enabled: false
            css_class:
                template: '@IntegrittySyliusProductBadgePlugin/admin/product_badge/form/sections/general/css_class.html.twig'
                priority: 100
                
        'sylius_admin.product_badge.update.content.form.sections.translations':
            name:
                template: '@IntegrittySyliusProductBadgePlugin/admin/product_badge/form/sections/translations/name.html.twig'
                priority: 0
