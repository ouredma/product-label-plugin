imports:
    - { resource: "@IntegrittySyliusProductLabelPlugin/config/config.yaml" }
    - { resource: "services_test.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true
    Integritty\SyliusProductLabelPlugin\Entity\ProductLabelInterface: ~

sylius_product:
    resources:
        product:
            classes:
                model: Tests\Integritty\SyliusProductLabelPlugin\Entity\Product

doctrine:
    orm:
        resolve_target_entities:
            Integritty\SyliusProductLabelPlugin\Entity\ProductInterface: Tests\Integritty\SyliusProductLabelPlugin\Entity\Product
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: xml
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/config/doctrine'
                        prefix: Tests\Integritty\SyliusProductLabelPlugin\Entity
