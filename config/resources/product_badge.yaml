# @see https://github.com/Sylius/SyliusResourceBundle/blob/master/docs/index.md
sylius_resource:
    resources:
        integritty_sylius_product_badge_plugin.product_badge:
            driver: doctrine/orm
            classes:
                model: Integritty\SyliusProductBadgePlugin\Entity\ProductBadge
                interface: Integritty\SyliusProductBadgePlugin\Entity\ProductBadgeInterface
                repository: Integritty\SyliusProductBadgePlugin\Repository\ProductBadgeRepository
            translation:
                classes:
                    model: Integritty\SyliusProductBadgePlugin\Entity\ProductBadgeTranslation
                    interface: Integritty\SyliusProductBadgePlugin\Entity\ProductBadgeTranslationInterface
                    repository: Integritty\SyliusProductBadgePlugin\Repository\ProductBadgeTranslationRepository
